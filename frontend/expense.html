<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./css/expense.css">
    <style>
        .report-section {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .filter-buttons {
            margin-bottom: 15px;
        }
        .filter-buttons button {
            padding: 6px 14px;
            margin-right: 8px;
            cursor: pointer;
        }
        .filter-buttons button.active {
            background-color: #2c3e50;
            color: white;
            border: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        #downloadExpenseBtn:disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="overflow: hidden; margin-bottom: 10px;">
            <button id="buyPremiumBtn" style="float: right;">Buy Premium Membership</button>
            <button id="downloadExpenseBtn" style="float: right; margin-right: 10px;" disabled>Download Expenses</button>
        </div>
        <div id="premiumFeatureContainer" style="margin-bottom: 10px;"></div>

        <h2>Daily Expenses</h2>
        <form id="expenseForm">
            <div class="form-control">
                <label for="expenseamount">Amount</label>
                <input type="number" id="expenseamount" required>
            </div>
            <div class="form-control">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g. Lunch at Domino's" required>
                <button type="button" id="aiSuggestBtn">✨ Auto-Detect Category</button>
            </div>
            <div class="form-control">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="" disabled selected>Choose a category</option>
                    <option value="Food">Food</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Salary">Salary</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit">Add Expense</button>
            <p id="message"></p>
        </form>

        <h3>Expenses</h3>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <h3>Expenses</h3>
            <div>
                <label for="rowsPerPage">Expenses per page:</label>
                <select id="rowsPerPage">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="40">40</option>
                </select>
            </div>
        </div>
        <ul id="listOfExpenses"></ul>
        <div id="paginationControls" style="margin-top: 15px; margin-bottom: 20px;"></div>

        <div id="leaderboardSection"></div>

        <!-- Premium Report Section (Daily / Weekly / Monthly) -->
        <div id="premiumReportSection" class="report-section" style="display: none;">
            <h2>Day to Day Expenses & Income Report</h2>
            <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="daily">Daily</button>
                <button type="button" class="filter-btn" data-filter="weekly">Weekly</button>
                <button type="button" class="filter-btn" data-filter="monthly">Monthly</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Income (₹)</th>
                        <th>Expense (₹)</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
                <tfoot>
                    <tr>
                        <th colspan="3">Total</th>
                        <th id="totalIncomeCell">₹0</th>
                        <th id="totalExpenseCell">₹0</th>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div style="margin-top: 20px;">
            <button id="aiInsightsBtn">🧠 Get AI Spending Insights</button>
            <div id="aiInsightsBox" style="margin-top: 10px; white-space: pre-line;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="./js/expense.js"></script>
</body>
</html>
